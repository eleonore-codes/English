<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English 7 · Unit 1 · Past Tenses & Connections</title>
<style>
:root{
  --bg:#081317;--panel:#10252b;--petrol:#126b75;--line:#315058;
  --text:#f1f7f8;--muted:#b8c9cc;--light:#f4fbfb;--ink:#102126;
  --green:#2f9c68;--red:#c74d4d;--amber:#caa24a
}
*{box-sizing:border-box}
html{font-size:17px}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5
}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:16px 14px 44px}
.top{margin-bottom:14px}
.eyebrow{color:#a9dadd;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
h1{font-size:clamp(1.6rem,6vw,2.35rem);line-height:1.1;margin:.2rem 0}
.subtitle{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px}
.light{background:var(--light);color:var(--ink)}
.progress{height:12px;background:#1a343b;border-radius:999px;overflow:hidden;margin-top:9px}
.bar{height:100%;background:var(--petrol);width:0;transition:width .2s ease}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{background:#19363d;color:var(--muted);padding:6px 9px;border-radius:999px;font-size:.82rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
.menu{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:17px;text-align:left;cursor:pointer;min-height:126px}
.menu strong{display:block;font-size:1.05rem;margin-bottom:4px}
.menu span{color:var(--muted);font-size:.9rem}
.primary,.secondary,.choice{border-radius:14px;padding:13px 15px;cursor:pointer;min-height:50px}
.primary{border:0;background:var(--petrol);color:#fff;font-weight:800}
.secondary{border:1px solid var(--line);background:#18353c;color:var(--text)}
.choice{width:100%;display:block;text-align:left;margin:9px 0;border:1px solid var(--line);background:#17343b;color:var(--text)}
.choice:disabled,.primary:disabled{opacity:.65}
.feedback{padding:12px 14px;border-radius:14px;margin-top:12px}
.ok{border:1px solid var(--green);background:rgba(47,156,104,.16);color:#d5f5e4}
.no{border:1px solid var(--red);background:rgba(199,77,77,.16);color:#ffdede}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;background:#0d2228;color:var(--text);min-height:52px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.hidden{display:none!important}
.small{font-size:.88rem;color:var(--muted)}
.question{font-size:1.18rem;margin:13px 0}
.session-result{text-align:center}
.session-result .big{font-size:2.05rem;font-weight:900}
.skillbox{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 2px}
.skillstate{font-weight:800}
.state-new{color:var(--muted)}
.state-practiced{color:#d9c57c}
.state-unsure{color:#ffb2b2}
.state-mastered{color:#a9e4c5}
.reset{margin-top:18px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:12px}
.note{font-size:.88rem;color:var(--muted);margin-top:7px}
@media(max-width:560px){
  html{font-size:18px}.app{padding:12px}.card{padding:15px}.menu{min-height:0}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="eyebrow">English 7</div>
  <h1>Unit 1 · Past Tenses &amp; Connections</h1>
  <div class="subtitle">Grammatik, Vokabeln und adaptive Wiederholung</div>
</header>

<section id="dashboard">
  <div class="card">
    <strong>Dein Lernstand</strong>
    <div class="progress" aria-label="Fortschritt"><div class="bar" id="bar"></div></div>
    <div class="stats">
      <span class="pill" id="nNew"></span>
      <span class="pill" id="nPractice"></span>
      <span class="pill" id="nUnsure"></span>
      <span class="pill" id="nMaster"></span>
    </div>
    <div class="note">„Beherrscht“ wird erst erreicht, wenn ein Lernziel mehrfach und mindestens einmal aktiv seit dem letzten Fehler abgerufen wurde.</div>
    <div id="areaProgress" class="note" style="margin-top:12px"></div>
  </div>

  <div class="grid">
    <button class="menu" onclick="startSession('grammar')">
      <strong>Grammatik</strong>
      <span>Past Progressive, Zeitformen, Connectives und Compound Words</span>
    </button>
    <button class="menu" onclick="startSession('vocab')">
      <strong>Vokabeln &amp; Chunks</strong>
      <span>Vollständiger Unit-Wortschatz: erkennen und aktiv abrufen</span>
    </button>
    <button class="menu" onclick="startSession('verbs')">
      <strong>Irregular Verbs</strong>
      <span>Formen erkennen und im Kontext abrufen</span>
    </button>
    <button class="menu" onclick="startSession('mixed')">
      <strong>Unit Training</strong>
      <span>10 Aufgaben, unsichere Lernziele zuerst</span>
    </button>
  </div>
</section>

<section id="trainer" class="hidden">
  <div class="card" tabindex="-1" id="taskCard">
    <div class="small" id="counter"></div>
    <div class="eyebrow" id="area"></div>
    <div class="skillbox">
      <span class="small">Lernzielstatus</span>
      <span id="skillState" class="skillstate"></span>
    </div>
    <h2 id="title"></h2>
    <div class="question" id="prompt"></div>
    <div id="answerArea"></div>

    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <div id="correction" class="card light hidden"></div>
    <div id="rule" class="card light hidden"></div>

    <div class="actions">
      <button class="secondary" id="ruleBtn" onclick="toggleRule()">Regel ansehen</button>
      <button class="primary hidden" id="nextBtn" onclick="next()">Nächste Aufgabe</button>
      <button class="secondary" onclick="home()">Zur Übersicht</button>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card session-result">
    <div class="eyebrow">Training geschafft</div>
    <div class="big" id="score"></div>
    <p id="resultText"></p>
    <div class="actions" style="justify-content:center">
      <button class="primary" id="continueUnsure" onclick="repeatUnsure()">Unsichere weitertrainieren</button>
      <button class="secondary" onclick="home()">Zur Übersicht</button>
    </div>
  </div>
</section>

<button class="reset" onclick="resetProgress()">Testfortschritt zurücksetzen</button>
</main>

function vocabAnswers(en){
  const set=new Set(VOCAB_ACCEPTED[en]||[en]);
  const originals=[...set];
  originals.forEach(v=>{
    set.add(v.replace(/\bsb\b/g,"somebody").replace(/\bsth\b/g,"something"));
    set.add(v.replace(/\bsb\b/g,"someone").replace(/\bsth\b/g,"something"));
    set.add(v.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim());
    if(/^to\s+/i.test(v)) set.add(v.replace(/^to\s+/i,""));
  });
  return [...set].filter(Boolean);
}

  feelings:["desperate","optimistic","patient","depressed","helpless","embarrassed","uncomfortable","brave","powerful","moving","dramatic","polite","harsh","understanding"],

function vocabCategory(en){
  for(const [cat,terms] of Object.entries(VOCAB_CATEGORIES)){
    if(terms.includes(en)) return cat;
  }
  const x=en.toLowerCase();
  if(/^to\s/.test(x)) return "actions";
  if(/^(although|however|while|as|so|even if|rather|quite|still|which|such|another|following)$/.test(x)) return "connectors";
  if(/(ly$)/.test(x)) return "descriptors";
  if(/(man$|ologist$)/.test(x)) return "people_relationships";
  if(/(land|ireland|scotland|england|welsh|country|capital|town|flat)/.test(x)) return "places";
  if(/(advice|conversation|reaction|comment|draft|spelling|note|autograph|goodbye)/.test(x)) return "communication";
  return "general";
}

const STORE="english7_u1_v0_9_1";
let state=loadState();
let queue=[],pos=0,correct=0,lastMode="mixed",answered=false,isUnsureMini=false;

function loadState(){
  try{
    const raw=localStorage.getItem(STORE);
    if(!raw) return {};
    const parsed=JSON.parse(raw);
    return parsed && typeof parsed==="object" && !Array.isArray(parsed) ? parsed : {};
  }catch(e){
    return {};
  }
}
function defaultSkillState(){
  return {
    status:"new",
    evidence:0,
    correctTotal:0,
    wrongTotal:0,
    correctSinceError:0,
    activeCorrectEver:false,
    activeCorrectSinceError:false,
    lastItem:null
  };
}
function S(skill){
  return {...defaultSkillState(),...(state[skill]||{})};
}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
  stats();
}
function norm(x){
  return String(x)
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[“”„"]/g,"")
    .replace(/…/g,"...")
    .replace(/\b(?:somebody|someone)\b/g,"sb")
    .replace(/\bsomething\b/g,"sth")
    .replace(/\s*\.\.\.\s*/g," ")
    .replace(/[.!?,;:]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function isCorrect(item,val){
  return item.answers.some(a=>norm(a)===norm(val));
}
function calcStatus(s){
  if(s.status==="unsure" && s.correctSinceError<2) return "unsure";
  if(s.evidence>=5 && s.correctSinceError>=2 && s.activeCorrectSinceError) return "mastered";
  if(s.correctTotal>0) return "practiced";
  return "new";
}
function updateSkill(item,ok){
  let s=S(item.skill);
  if(ok){
    s.correctTotal++;
    s.correctSinceError++;
    s.evidence+=item.weight;
    if(item.active){
      s.activeCorrectEver=true;
      s.activeCorrectSinceError=true;
    }
  }else{
    s.wrongTotal++;
    s.correctSinceError=0;
    s.activeCorrectSinceError=false;
    s.evidence=Math.max(0,s.evidence-2);
    s.status="unsure";
  }
  s.lastItem=item.id;
  s.status=calcStatus(s);
  state[item.skill]=s;
  save();
}
function stats(){
  let c={new:0,practiced:0,unsure:0,mastered:0};
  Object.keys(SKILLS).forEach(k=>c[S(k).status]++);
  nNew.textContent="Neu "+c.new;
  nPractice.textContent="Geübt "+c.practiced;
  nUnsure.textContent="Unsicher "+c.unsure;
  nMaster.textContent="Beherrscht "+c.mastered;
  bar.style.width=(100*c.mastered/Object.keys(SKILLS).length)+"%";

  const areas=[
    ["Grammatik","grammar"],
    ["Vokabeln & Chunks","vocab"],
    ["Say it","sayit"],
    ["Irregular Verbs","verbs"]
  ];
  areaProgress.innerHTML=areas.map(([label,g])=>{
    const keys=Object.keys(SKILLS).filter(k=>SKILLS[k].group===g);
    const mastered=keys.filter(k=>S(k).status==="mastered").length;
    return `<div style="margin-top:5px"><strong>${label}:</strong> ${mastered} von ${keys.length} beherrscht</div>`;
  }).join("");
}
function stateLabel(status){
  return {new:"Neu",practiced:"Geübt",unsure:"Unsicher",mastered:"Beherrscht"}[status];
}
function groupSkills(mode){
  return Object.keys(SKILLS).filter(k=>{
    if(mode==="mixed") return true;
    if(mode==="vocab") return SKILLS[k].group==="vocab" || SKILLS[k].group==="sayit";
    return SKILLS[k].group===mode;
  });
}
function shuffled(arr){
  return [...arr].sort(()=>Math.random()-.5);
}
const itemLastUsed={};
let useTick=0;

function pickItemForSkill(skill,avoidIds=[],hardAvoidId=null){
  const all=ITEMS.filter(i=>i.skill===skill);
  if(!all.length) return null;

  let candidates=all.filter(i=>!avoidIds.includes(i.id));

  // If every variant has already been used, reuse the least recently used one.
  // But never repeat the immediately preceding/failed item if another variant exists.
  if(!candidates.length){
    candidates=all.filter(i=>i.id!==hardAvoidId);
    if(!candidates.length) candidates=all;
    candidates.sort((a,b)=>(itemLastUsed[a.id]||0)-(itemLastUsed[b.id]||0));
    candidates=[candidates[0]];
  }

  const s=S(skill);
  if(s.status==="new"){
    const recognition=candidates.filter(i=>!i.active);
    if(recognition.length) candidates=recognition;
  }else{
    const active=candidates.filter(i=>i.active);
    if(active.length) candidates=active;
  }

  // Keep hardAvoidId excluded whenever at least one alternative remains.
  if(hardAvoidId && candidates.length>1){
    const withoutImmediate=candidates.filter(i=>i.id!==hardAvoidId);
    if(withoutImmediate.length) candidates=withoutImmediate;
  }

  const chosen=candidates[Math.floor(Math.random()*candidates.length)];
  if(chosen) itemLastUsed[chosen.id]=++useTick;
  return chosen;
}
function buildBaseQueue(mode){
  let skills=groupSkills(mode);
  const rank={unsure:0,new:1,practiced:2,mastered:3};
  skills.sort((a,b)=>rank[S(a).status]-rank[S(b).status]||Math.random()-.5);
  let q=[];
  for(const skill of skills){
    if(q.length>=BASE_SESSION) break;
    q.push(pickItemForSkill(skill,[S(skill).lastItem].filter(Boolean),S(skill).lastItem));
  }
  let safety=0;
  while(q.length<BASE_SESSION && skills.length && safety<100){
    safety++;
    const skill=skills[Math.floor(Math.random()*skills.length)];
    const recentIds=q.filter(x=>x.skill===skill).map(x=>x.id);
    const candidate=pickItemForSkill(skill,recentIds,recentIds.length?recentIds[recentIds.length-1]:null);
    if(candidate) q.push(candidate);
  }
  return q.slice(0,BASE_SESSION);
}
function buildUnsureQueue(mode){
  const skills=shuffled(groupSkills(mode).filter(k=>S(k).status==="unsure"));
  if(!skills.length) return [];

  const perSkill={};
  for(const skill of skills){
    const last=S(skill).lastItem;
    perSkill[skill]=shuffled(ITEMS.filter(i=>i.skill===skill && i.id!==last));
    if(!perSkill[skill].length) perSkill[skill]=shuffled(ITEMS.filter(i=>i.skill===skill));
  }

  let q=[];
  let round=0;
  while(q.length<MAX_UNSURE_MINI){
    let added=false;
    for(const skill of skills){
      const variants=perSkill[skill];
      if(round<variants.length && q.length<MAX_UNSURE_MINI){
        q.push(variants[round]);
        added=true;
      }
    }
    if(!added) break;
    round++;
  }
  return q;
}
function startSession(mode,onlyUnsure=false){
  lastMode=mode;
  isUnsureMini=onlyUnsure;
  queue=onlyUnsure?buildUnsureQueue(mode):buildBaseQueue(mode);
  pos=0;correct=0;
  dashboard.classList.add("hidden");
  result.classList.add("hidden");
  trainer.classList.remove("hidden");
  if(!queue.length){finish();return}
  render();
}
function render(){
  answered=false;
  const i=queue[pos];
  if(!i){finish();return}
  const s=S(i.skill);
  counter.textContent=isUnsureMini?`Unsicherheiten-Training · Aufgabe ${pos+1}`:`Training · Aufgabe ${pos+1}`;
  area.textContent=i.area;
  title.textContent=i.title;
  prompt.innerHTML=i.prompt;
  skillState.textContent=stateLabel(s.status);
  skillState.className="skillstate state-"+s.status;
  feedback.className="feedback hidden";
  feedback.innerHTML="";
  correction.classList.add("hidden");
  correction.innerHTML="";
  rule.classList.add("hidden");
  rule.innerHTML=i.rule;
  nextBtn.classList.add("hidden");
  ruleBtn.textContent="Regel ansehen";
  answerArea.innerHTML="";
  if(i.type==="mc"){
    i.choices.forEach(choice=>{
      const b=document.createElement("button");
      b.className="choice";
      const span=document.createElement("span");
      if(choice.lang) span.lang=choice.lang;
      span.textContent=choice.text;
      b.appendChild(span);
      b.onclick=()=>check(choice.text);
      answerArea.appendChild(b);
    });
    setTimeout(()=>taskCard.focus(),40);
  }else{
    const inp=document.createElement("input");
    inp.type="text";
    inp.id="input";
    inp.autocomplete="off";
    inp.spellcheck=false;
    inp.setAttribute("aria-label","Deine Antwort");
    inp.placeholder="Deine Antwort";
    answerArea.appendChild(inp);

    const b=document.createElement("button");
    b.className="primary";
    b.style.marginTop="10px";
    b.textContent="Prüfen";
    b.onclick=()=>check(inp.value);
    answerArea.appendChild(b);

    inp.addEventListener("keydown",e=>{if(e.key==="Enter")check(inp.value)});
    setTimeout(()=>inp.focus(),50);
  }
}
function scheduleRetest(item){
  if(isUnsureMini) return;
  if(queue.length>=MAX_SESSION) return;
  const minGap=3,maxGap=5;
  const insertAt=Math.min(queue.length,pos+minGap+Math.floor(Math.random()*(maxGap-minGap+1)));
  const nearSameSkill=queue.slice(pos+1,insertAt+1).some(x=>x.skill===item.skill);
  if(nearSameSkill) return;

  const usedIds=queue.filter(x=>x.skill===item.skill).map(x=>x.id);
  const alt=pickItemForSkill(item.skill,[item.id,...usedIds],item.id);
  if(!alt) return;
  queue.splice(insertAt,0,alt);
}
function check(val){
  if(answered) return;
  answered=true;
  const i=queue[pos],ok=isCorrect(i,val);
  updateSkill(i,ok);
  if(ok) correct++;
  else scheduleRetest(i);

  feedback.classList.remove("hidden");
  feedback.classList.add(ok?"ok":"no");
  feedback.innerHTML=ok
    ? `✓ <strong>Richtig.</strong>`
    : `✗ <strong>Noch nicht.</strong>`;

  correction.classList.remove("hidden");
  correction.innerHTML=ok
    ? `<strong>Lösung:</strong><br>${i.feedback}`
    : `<strong>So geht es:</strong><br>${i.rule}<br><br><strong>Richtige Lösung:</strong> <span lang="${i.answerLang||"en"}">${i.displayAnswer||i.answers[0]}</span>`;

  answerArea.querySelectorAll("button,input").forEach(e=>e.disabled=true);
  nextBtn.classList.remove("hidden");
  nextBtn.focus();
}
function next(){
  pos++;
  if(pos>=queue.length) finish();
  else render();
}
function finish(){
  trainer.classList.add("hidden");
  result.classList.remove("hidden");

  score.textContent=queue.length?`${correct} / ${queue.length} richtig`:"";
  const modeSkills=groupSkills(lastMode);
  const unsure=modeSkills.filter(k=>S(k).status==="unsure").length;
  const mastered=modeSkills.filter(k=>S(k).status==="mastered").length;

  if(!queue.length){
    resultText.textContent="Aktuell gibt es keine unsicheren Lernziele in diesem Bereich.";
    continueUnsure.classList.add("hidden");
  }else if(unsure){
    resultText.textContent=`${unsure} Lernziel${unsure===1?" ist":"e sind"} noch unsicher. Diese werden im nächsten Training bevorzugt und mit anderen Varianten wiederholt.`;
    continueUnsure.classList.remove("hidden");
  }else{
    resultText.textContent=`Kein Lernziel ist aktuell unsicher. ${mastered} Lernziel${mastered===1?" ist":"e sind"} bereits beherrscht.`;
    continueUnsure.classList.add("hidden");
  }
}
function repeatUnsure(){
  startSession(lastMode,true);
}
function toggleRule(){
  rule.classList.toggle("hidden");
  ruleBtn.textContent=rule.classList.contains("hidden")?"Regel ansehen":"Regel schließen";
}
function home(){
  trainer.classList.add("hidden");
  result.classList.add("hidden");
  dashboard.classList.remove("hidden");
  stats();
}
function resetProgress(){
  if(confirm("Testfortschritt wirklich zurücksetzen?")){
    state={};
    try{localStorage.removeItem(STORE);}catch(e){}
    save();
    home();
  }
}
function contentAudit(){
  const errors=[];
  const ids=new Set();
  ITEMS.forEach(i=>{
    if(ids.has(i.id)) errors.push("Doppelte Aufgaben-ID: "+i.id);
    ids.add(i.id);
    if(!SKILLS[i.skill]) errors.push("Fehlender Skill für Aufgabe: "+i.id);
    if(!Array.isArray(i.answers)||!i.answers.length) errors.push("Keine Antwort für Aufgabe: "+i.id);

    if(i.type==="mc" && Array.isArray(i.choices)){
      const choiceTexts=i.choices.map(c=>typeof c==="string"?c:c.text);
      const normalizedChoices=choiceTexts.map(norm);
      if(new Set(normalizedChoices).size!==normalizedChoices.length){
        errors.push("Doppelte MC-Option: "+i.id);
      }
      const correct=new Set((i.answers||[]).map(norm));
      const correctChoiceIndexes=normalizedChoices
        .map((v,index)=>correct.has(v)?index:-1)
        .filter(index=>index>=0);
      if(correctChoiceIndexes.length!==1){
        errors.push("MC braucht genau eine richtige Option: "+i.id);
      }
    }
  });

  Object.keys(SKILLS).forEach(skill=>{
    const items=ITEMS.filter(i=>i.skill===skill);
    if(!items.length) errors.push("Skill ohne Aufgabe: "+skill);
    const hasRecognition=items.some(i=>!i.active);
    const hasRecall=items.some(i=>i.active);
    // Grammar can intentionally be active-heavy; vocabulary/Say-it must have both.
    if(["vocab","sayit"].includes(SKILLS[skill].group)){
      if(!hasRecognition) errors.push("Kein Recognition-Item: "+skill);
      if(!hasRecall) errors.push("Kein Active-Recall-Item: "+skill);
    }
  });

  FULL_VOCAB.forEach(([en])=>{
    if(!SKILLS[vocabSkillId(en)]) errors.push("Vokabel ohne Skill: "+en);
  });

  if(errors.length) console.error("English 7 content audit:",errors);
  return errors;
}

const CONTENT_AUDIT_ERRORS=contentAudit();
stats();
