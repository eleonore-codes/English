<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5f68">
  <meta name="color-scheme" content="dark">
  <title>English</title>
  <style>
    :root{
      --bg:#071416;
      --panel:#10272b;
      --panel-hover:#143238;
      --petrol:#18727c;
      --petrol-light:#55aeb6;
      --text:#f6f9f9;
      --muted:#c5d3d5;
      --line:#285158;
      --shadow:0 12px 30px rgba(0,0,0,.25);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{font-size:18px}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg,#071214 0%,var(--bg) 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.5;
    }
    main{
      width:min(900px,100%);
      margin:0 auto;
      padding:40px 18px 56px;
    }
    header{
      text-align:center;
      padding:20px 8px 34px;
    }
    .label{
      margin:0 0 8px;
      color:#a9d9dd;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:.82rem;
    }
    h1{
      margin:0;
      font-size:clamp(2.8rem,12vw,4.8rem);
      line-height:1;
    }
    .intro{
      margin:16px auto 0;
      max-width:32rem;
      color:var(--muted);
      font-size:1.08rem;
    }
    .grades{
      display:grid;
      gap:18px;
    }
    .grade{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      min-height:150px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(145deg,var(--panel-hover),var(--panel));
      color:var(--text);
      text-decoration:none;
      box-shadow:var(--shadow);
      transition:transform .15s ease,border-color .15s ease,background .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .grade:hover{
      transform:translateY(-2px);
      border-color:var(--petrol-light);
    }
    .grade:focus-visible{
      outline:4px solid var(--petrol-light);
      outline-offset:3px;
    }
    .grade-name{
      display:block;
      font-size:clamp(1.65rem,7vw,2.15rem);
      line-height:1.15;
      font-weight:850;
    }
    .grade-sub{
      display:block;
      margin-top:8px;
      color:var(--muted);
      font-size:.98rem;
    }
    .arrow{
      display:grid;
      place-items:center;
      flex:0 0 48px;
      width:48px;
      height:48px;
      border-radius:50%;
      background:var(--petrol);
      font-size:1.5rem;
      font-weight:800;
      aria-hidden:true;
    }
    footer{
      margin-top:28px;
      text-align:center;
      color:#96aaad;
      font-size:.86rem;
    }
    @media(min-width:720px){
      main{padding-top:64px}
      .grades{grid-template-columns:repeat(3,1fr)}
      .grade{
        min-height:240px;
        flex-direction:column;
        align-items:flex-start;
        justify-content:space-between;
      }
      .arrow{align-self:flex-end}
    }
    @media(prefers-reduced-motion:reduce){
      .grade{transition:none}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">Learning Apps</p>
      <h1>English</h1>
      <p class="intro">Wähle deine Klassenstufe.</p>
    </header>

    <nav class="grades" aria-label="Klassenstufe auswählen">
      <a class="grade" href="english-5/index.html">
        <span>
          <span class="grade-name">English 5</span>
          <span class="grade-sub">Klasse 5</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="grade" href="english-6/index.html">
        <span>
          <span class="grade-name">English 6</span>
          <span class="grade-sub">Klasse 6</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="grade" href="english-7/index.html">
        <span>
          <span class="grade-name">English 7</span>
          <span class="grade-sub">Klasse 7</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

<footer>
  <div>Grammatik · Vokabeln · adaptives Training</div>
  <div class="credit">
    Pädagogisches Konzept &amp; Entwicklung:
    <strong>Prof. Dr. Eleonore Soei-Winkels</strong>
  </div>
</footer>
  </main>
</body>
</html>
